name: Build BTT Pi1 Image
on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "内核分支（vendor=BTT官方6.6.y 推荐）"
        type: choice
        default: "vendor"
        options: [vendor, current, edge]
      release:
        description: "发行版"
        type: choice
        default: "bookworm"
        options: [bookworm, jammy, noble]
      desktop_env:
        description: "桌面环境（server=无桌面；noble 仅支持 xfce）"
        type: choice
        default: "xfce"
        options: [xfce, gnome, kde-plasma, mate, cinnamon, server]
      appgroups:
        description: "应用组（bookworm: browsers,internet,programming；jammy/noble: 仅 programming；留空=不装）"
        type: string
        default: "browsers"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: descriptinc/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout build framework
        uses: actions/checkout@v4
      - name: Prepare host
        shell: bash
        run: |
          # 等无人值守升级释放 apt 锁（jammy runner 常见 Error 2 来源）
          sudo systemctl stop unattended-upgrades 2>/dev/null || true
          for i in $(seq 1 30); do
            sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
            echo "等待 apt 锁释放... ($i)"
            sleep 5
          done
          sudo apt-get update
          sudo apt-get install -y wget

      - name: Build image (as root, no Docker, no self-relaunch)
        shell: bash
        run: |
          set -e

          KERNEL_BRANCH="${{ inputs.kernel_branch }}"
          RELEASE="${{ inputs.release }}"
          DESKTOP_ENV="${{ inputs.desktop_env }}"
          APPGROUPS="${{ inputs.appgroups }}"

          ARGS=(
            "BOARD=bigtreetech-cb1"
            "BRANCH=${KERNEL_BRANCH}"
            "RELEASE=${RELEASE}"
            "KERNEL_CONFIGURE=no"
            "COMPRESS_OUTPUTIMAGE=sha,img,xz"
            # CI 环境：允许直接以 root 运行，不走 Docker、不 sudo 自重启
            "ALLOW_ROOT=yes"
            "PREFER_DOCKER=no"
            "SET_OWNER_TO_UID=$(id -u)"   # 构建结束把产物属主改回 runner，保证 artifact 能上传
          )

          if [ "${DESKTOP_ENV}" = "server" ]; then
            ARGS+=("BUILD_DESKTOP=no" "BUILD_MINIMAL=no")
          else
            ARGS+=(
              "BUILD_DESKTOP=yes"
              "BUILD_MINIMAL=no"
              "DESKTOP_ENVIRONMENT=${DESKTOP_ENV}"
              "DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base"
            )
            if [ -n "${APPGROUPS}" ]; then
              ARGS+=("DESKTOP_APPGROUPS_SELECTED=${APPGROUPS}")
            fi
          fi

          echo "构建参数: ${ARGS[*]}"

          for attempt in 1 2; do
            if sudo ./compile.sh build "${ARGS[@]}"; then
              exit 0
            fi
            echo "第 ${attempt} 次构建失败，30 秒后重试..."
            sleep 30
          done
          echo "两次构建均失败"
          exit 1

      - name: Dump debootstrap log on failure
        if: failure()
        shell: bash
        run: |
          echo "=== 查找 debootstrap 日志 ==="
          sudo find .tmp output -name "debootstrap.log" -print 2>/dev/null | while read -r f; do
            echo "===== $f (最后 100 行) ====="
            sudo tail -n 100 "$f"
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .tmp/logs-*/
            output/debug/
          if-no-files-found: ignore

      - name: Upload image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: btt-pi1-image
          path: |
            output/images/*.img.xz
            output/images/*.img.xz.sha
          if-no-files-found: error
